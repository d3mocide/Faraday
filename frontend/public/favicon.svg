  <line x1="22" y1="13.5" x2="22" y2="25.5" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Central Electromagnetic Flux Spark Core -->
  <polygon points="17.5,7.5 11.5,16 15,16 14,24.5 20.5,15 17,15" fill="#ffffff" stroke="#0284c7" stroke-width="0.8" stroke-linejoin="round" />
